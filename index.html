<style>

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--lac:#16181D}}

html,body{margin:0;height:100%;background:#0b1020;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--krem);-webkit-user-select:none;user-select:none}

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

/* ================== AYARLAR ==================
   Her tribün 2 katlı; her kat ayrı açılıp kapanır. Yayındaki hal tek liste: ACIK (açılış sırasıyla).
   Koltuklar açılış sırasına göre dağıtılır: önce açılan kat, en erken yorum yapanlara gider;
   yeni kat açılınca mevcut taraftarların yeri değişmez. */
const PL=105, PW=68;                 // saha (m)
const SEAT_W=0.55, ROW_D=0.85, ROW_H=0.42;
// SİMETRİK STAT: tüm tribünler köşeleri kırık tek bir sekizgen halkanın parçaları.
// Her sıra her yerde aynı yükseklikte; alt kat ve üst kat her yerde aynı derinlikte. Kapasite şekilden hesaplanır.
const HALKA={X0:PL/2+7, Z0:PW/2+9, C0:10};          // iç kenar: kale arkası 7 m, uzun kenar 9 m, köşe pahı 10 m
const KAT=[null,{d0:0, satir:26, taban:0}, null];  // alt kat
KAT[2]={d0:26*ROW_D+4, satir:34, taban:0.5+26*ROW_H+4}; // üst kat (arada 4 m koridor + loca)
const PARCALAR=[ // halka sırası (komşuluk için)
  {seg:'E', kod:'D',   ad:'Doğu kale arkası'},
  {seg:'SE',kod:'GD',  ad:'Güneydoğu köşe'},
  {seg:'S', kod:'G',   ad:'Güney Tribünü'},
  {seg:'SW',kod:'GB',  ad:'Güneybatı köşe'},
  {seg:'W', kod:'B',   ad:'5. Tribün'},
  {seg:'NW',kod:'KBK', ad:'Kuzeybatı köşe'},
  {seg:'N', kod:'K',   ad:'Kuzey Ana Tribün'},
  {seg:'NE',kod:'KDK', ad:'Kuzeydoğu köşe'},
];
const TRIBUNLER=[{id:'KB', ad:'Kombineli Tribün', kisa:'Kombine', yon:'S', bas:5, hedef:100, gen:30, kombine:true}];
const SIRA_LISTE=['W','S','E','N','SW','SE','NW','NE'];
for(const seg of SIRA_LISTE){const pr=PARCALAR.find(x=>x.seg===seg);
  for(const kat of [1,2]) TRIBUNLER.push({id:pr.kod+kat, ad:pr.ad+' · '+(kat===1?'alt':'üst')+' kat', kisa:pr.ad+' '+(kat===1?'alt':'üst'), seg, kat});}
const url = new URLSearchParams(location.search);
let ACIK = (url.get('acik')||'B1,G1,K1,D1,GB1,GD1,KBK1,KDK1,B2,G2,K2,D2,GB2,GD2,KBK2,KDK2').split(',').filter(x=>TRIBUNLER.some(t=>t.id===x));
// İnşaat alanları: kapalı katın yerinde şantiye (ayrı aç/kapa). Kat açılınca şantiye kendiliğinden gizlenir.
let INSAAT = (url.has('insaat')?url.get('insaat'):'').split(',').filter(x=>TRIBUNLER.some(t=>t.id===x&&!t.kombine));

/* ================== VERİ (şimdilik deneme adları) ================== */
const GERCEK_ORNEK=['upown41','ahmettss.36','reza.sangshkan','keremcan_bektas01'];
function denemeVeri(n){
  const on=['ali','mert','emre','burak','can','deniz','ece','zeynep','kaan','efe','yusuf','ayse','baris','serkan','onur','hakan','selin','tuna','arda','irem'];
  const son=['_06','.34','_fb','_gs','_bjk','_ts','.35','_07','01','_44','.ultras','_camur','61','.16','_42','_1903','_1907','_1905'];
  let s=12345; const r=()=>(s=(s*16807)%2147483647)/2147483647;
  const a=[...GERCEK_ORNEK]; const set=new Set(a);
  while(a.length<n){const u=on[(r()*on.length)|0]+son[(r()*son.length)|0]+((r()*900)|0);if(!set.has(u)){set.add(u);a.push(u);}}
  return a; // sıra = ilk yorum zamanı
}
// Koltuğunu kaldırtanlar (DM ile istek → bu liste; ileride veri dosyasında). Bu adlar sitede hiç gösterilmez.
const KALDIRILAN=new Set([]);
const ACILIS_T0=performance.now();
async function yukle(oran,yazi){const b=document.getElementById('yukBar'); if(b) b.style.width=Math.round(oran*100)+'%'; const y=document.getElementById('yukYazi'); if(y&&yazi) y.textContent=yazi; await new Promise(r=>setTimeout(r,0));}
// Taraftarlar: takipciler.json {guncelleme, isimler[]} (takip sırasına göre). ?demo=1 → deneme adları.
let VERI={guncelleme:null,isimler:[]};
try{const r=await fetch('takipciler.json?t='+Date.now()); if(r.ok) VERI=await r.json();}catch(e){}
if(window.__VERI) VERI=window.__VERI;
const TARAFTAR = (url.get('demo')==='1'?denemeVeri(+(url.get('n')||25000)):VERI.isimler).filter(u=>!KALDIRILAN.has(String(u).toLowerCase()));

/* ================== SAHNE ================== */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
let PR=Math.min(devicePixelRatio,1.75); renderer.setPixelRatio(PR); let composer=null;
const scene=new THREE.Scene();
scene.background=new THREE.Color('#0b1020');
scene.fog=new THREE.Fog('#0b1020',650,1400);
const cam=new THREE.PerspectiveCamera(45,1,1,1600);
const ctl=new OrbitControls(cam,canvas);
ctl.enableDamping=true; ctl.maxPolarAngle=1.38; ctl.minDistance=12; ctl.maxDistance=540; ctl.target.set(0,0,8);
cam.position.set(90,300,285); // kuş bakışı açılış

scene.add(new THREE.HemisphereLight('#9fb2e6','#2a2218',1.15));
const ay=new THREE.DirectionalLight('#c8d4ff',0.75); ay.position.set(-120,200,80); scene.add(ay);
const projektor=new THREE.DirectionalLight('#fff1cf',0.9); projektor.position.set(60,160,-40); scene.add(projektor);

const M=(c,o={})=>new THREE.MeshLambertMaterial({color:c,flatShading:true,...o});
// zemin
const zemin=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),M('#1d2b22')); zemin.rotation.x=-Math.PI/2; zemin.position.y=-0.05; scene.add(zemin);
// saha dokusu (çim şeritleri + çizgiler)
function sahaDokusu(){
  const cv=document.createElement('canvas'); cv.width=1050; cv.height=680; const x=cv.getContext('2d');
  for(let i=0;i<14;i++){x.fillStyle=i%2?'#2E9E5B':'#29904f'; x.fillRect(i*75,0,75,680);}
  x.strokeStyle='#eef6e8'; x.lineWidth=5;
  x.strokeRect(10,10,1030,660); x.beginPath(); x.moveTo(525,10); x.lineTo(525,670); x.stroke();
  x.beginPath(); x.arc(525,340,91,0,7); x.stroke();
  x.strokeRect(10,138,165,404); x.strokeRect(875,138,165,404); x.strokeRect(10,248,55,184); x.strokeRect(985,248,55,184);
  const t=new THREE.CanvasTexture(cv); t.anisotropy=4; t.colorSpace=THREE.SRGBColorSpace; return t;
}
const saha=new THREE.Mesh(new THREE.PlaneGeometry(PL+6,PW+6),new THREE.MeshLambertMaterial({map:sahaDokusu()}));
saha.rotation.x=-Math.PI/2; scene.add(saha);
const pist=new THREE.Mesh(new THREE.PlaneGeometry(PL+14,PW+14),M('#3a2a1e')); pist.rotation.x=-Math.PI/2; pist.position.y=-0.02; scene.add(pist);
// kaleler
for(const sx of [-1,1]){
  const g=new THREE.Group(); const w=M('#ffffff');
  const dir=(h)=>new THREE.Mesh(new THREE.BoxGeometry(0.15,h,0.15),w);
  const a=dir(2.44); a.position.set(0,1.22,-3.66); const b=dir(2.44); b.position.set(0,1.22,3.66);
  const ust=new THREE.Mesh(new THREE.BoxGeometry(0.15,0.15,7.47),w); ust.position.y=2.44;
  g.add(a,b,ust); g.position.x=sx*(PL/2+3); scene.add(g);
}
// reklam panoları: "BURASI KİRALIK"
function panoDokusu(){
  const cv=document.createElement('canvas'); cv.width=512; cv.height=72; const x=cv.getContext('2d');
  x.fillStyle='#16181D'; x.fillRect(0,0,512,72); x.fillStyle='#D7262E'; x.fillRect(0,0,10,72); x.fillRect(502,0,10,72);
  x.fillStyle='#FF6B6B'; x.font='900 40px system-ui'; x.textAlign='center'; x.textBaseline='middle';
  x.fillText('BURASI KİRALIK',256,30); x.font='800 17px system-ui'; x.fillStyle='#F4F1EA'; x.fillText('Markan burada · @besincitribun DM',256,58);
  const t=new THREE.CanvasTexture(cv); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=THREE.RepeatWrapping; return t;
}
const panoTex=panoDokusu();
const panolar=[];
function pano(x,z,uz,rotY){const t=panoTex.clone(); t.repeat.set(Math.round(uz/10),1); t.needsUpdate=true;
  const m=new THREE.Mesh(new THREE.BoxGeometry(uz,1.4,0.2),[M('#0E0F12'),M('#0E0F12'),M('#0E0F12'),M('#0E0F12'),new THREE.MeshBasicMaterial({map:t}),M('#0E0F12')]);
  m.position.set(x,0.7,z); m.rotation.y=rotY; scene.add(m); panolar.push(m);}
pano(0,PW/2+5,PL-6,Math.PI); pano(0,-PW/2-5,PL-6,0); pano(-PL/2-5.5,0,PW-10,Math.PI/2); pano(PL/2+5.5,0,PW-10,-Math.PI/2);

/* ================== TRİBÜNLER ================== */
// yerel koordinat: tribün önü sahaya bakar. u = boyuna (gen), d = sahadan uzaklık, y = yükseklik
function yerlestir(t,u,d,y){
  const hx=PL/2, hz=PW/2;
  switch(t.yon){
    case 'W': return new THREE.Vector3(-hx-d, y, u);
    case 'E': return new THREE.Vector3(hx+d, y, -u);
    case 'S': return new THREE.Vector3(u, y, hz+d);
    case 'N': return new THREE.Vector3(-u, y, -hz-d);
  }}
const rotY={W:Math.PI/2,E:-Math.PI/2,S:0,N:Math.PI};
const betonM=M('#3a4566'), betonK=M('#2a3350'), cati=M('#16181D'), turM=M('#D7262E');
const tribunGrup=[];
const lambaGeo=new THREE.BoxGeometry(0.9,0.5,0.9), lambaMat=new THREE.MeshBasicMaterial({color:'#fff6d8'}), serritMat=new THREE.MeshBasicMaterial({color:'#ff3b3b'});
const tmp=new THREE.Object3D(), col=new THREE.Color();
const koltuklar=[]; // {p, t, r, no}
const ucDuvarlar=[]; // parça uçlarındaki duvarlar: komşu parça (aynı kat) açıksa gizlenir
// d uzaklığındaki sekizgen: segmentin iki ucu (x,z)
function segUclar(seg,d){
  const X=HALKA.X0+d, Z=HALKA.Z0+d, c=HALKA.C0+d*(2-Math.SQRT2);
  switch(seg){
    case 'E': return [[X,-(Z-c)],[X,Z-c]];
    case 'SE':return [[X,Z-c],[X-c,Z]];
    case 'S': return [[X-c,Z],[-(X-c),Z]];
    case 'SW':return [[-(X-c),Z],[-X,Z-c]];
    case 'W': return [[-X,Z-c],[-X,-(Z-c)]];
    case 'NW':return [[-X,-(Z-c)],[-(X-c),-Z]];
    case 'N': return [[-(X-c),-Z],[X-c,-Z]];
    case 'NE':return [[X-c,-Z],[X,-(Z-c)]];
  }}
function kutuKoy(g,a,b,y0,y1,derinlik,mat,uzat=0.35){ // a→b boyunca, y0..y1 yüksekliğinde kutu (merkez a-b ortası)
  const dx=b[0]-a[0], dz=b[1]-a[1], L=Math.hypot(dx,dz);
  const m=new THREE.Mesh(new THREE.BoxGeometry(L+uzat,y1-y0,derinlik),mat);
  m.position.set((a[0]+b[0])/2,(y0+y1)/2,(a[1]+b[1])/2); m.rotation.y=Math.atan2(-dz,dx); g.add(m); return m;}
function parcaKur(t){
  const g=new THREE.Group(); t.grup=g; t.ilk=koltuklar.length;
  const K=KAT[t.kat]; let ySon=0;
  for(let r=0;r<K.satir;r++){
    const d=K.d0+r*ROW_D, y=K.taban+0.5+r*ROW_H;
    const [a,b]=segUclar(t.seg,d+ROW_D/2); kutuKoy(g,a,b,0,y,ROW_D,r%2?betonM:betonK);
    const [a2,b2]=segUclar(t.seg,d+ROW_D*0.45), L=Math.hypot(b2[0]-a2[0],b2[1]-a2[1]), n=Math.floor((L-1)/SEAT_W), bos=(L-n*SEAT_W)/2;
    for(let i=0;i<n;i++){const f=(bos+(i+0.5)*SEAT_W)/L; koltuklar.push({p:new THREE.Vector3(a2[0]+(b2[0]-a2[0])*f,y+0.25,a2[1]+(b2[1]-a2[1])*f),t,r:r+1,no:i+1});}
    ySon=y;
  }
  const dSon=K.d0+K.satir*ROW_D;
  {const [a,b]=segUclar(t.seg,dSon+0.6); kutuKoy(g,a,b,0,ySon+3,1.2,betonK,1.2);} // arka duvar
  // uç duvarları (sekizgenin köşe açıortayı boyunca)
  for(const uc of [0,1]){const p0=segUclar(t.seg,K.d0)[uc], p1=segUclar(t.seg,dSon+1.2)[uc];
    const w=kutuKoy(g,p0,p1,0,ySon+3,0.8,betonK,0); ucDuvarlar.push({m:w,t,uc});}
  if(t.kat===2){

      b.onclick=()=>{KIYAFET[anahtar]=deger; depo.koy('bt_kiyafet',JSON.stringify(KIYAFET)); avatarKur(); benAvatarYerlestir(); secenekCiz();};
      el.appendChild(b);}}
}
function dolapAc(){
  if(benIdx<0) return; secenekCiz(); document.getElementById('dolap').classList.add('ac'); bilgi.classList.remove('ac'); secili=null; isaret.visible=halka.visible=false; et.style.display='none';
  if(benIdx<kapasite){const p=koltuklar[sira[benIdx]].p; const yon=new THREE.Vector3(-p.x,0,-p.z).normalize();
    ctl.minDistance=2; ucusGit(p.clone().add(new THREE.Vector3(0,0.12,0)), p.clone().add(yon.multiplyScalar(7)).add(new THREE.Vector3(0,1.8,0)),1500); kusBtn.style.display='block';}
}

document.getElementById('benDegil').onclick=()=>{BEN=null; depo.koy('bt_ben',null); benIdxBul(); kur(); document.getElementById('dolap').classList.remove('ac');};
document.getElementById('benimBtn').onclick=()=>{if(benIdx<0)return; if(benIdx<kapasite) sec(benIdx); else {bilgi.innerHTML=`<b>@${BEN}</b> · Sıradasın: yeni tribün açılınca koltuğun gelecek.`; bilgi.classList.add('ac');}};

document.getElementById('bilgiBtn').onclick=()=>{secimiKapat();
  bilgi.innerHTML=`<b>🏟️ 5. Tribün</b><br>Burası senin tribünün. Instagram'da <b>@besincitribun</b>'u takip eden herkese bir koltuk. Koltuk sırası takip sırasına göre; liste düzenli güncellenir.
  <div style="margin-top:8px;font-size:13px;opacity:.9"><b>Gizlilik:</b> Sitede yalnızca Instagram kullanıcı adı durur; fotoğraf ya da başka bilgi yok. Kıyafet seçimin sadece bu telefonda saklanır.</div>
  <div class="btnler"><button class="ikincil" onclick="this.closest('.bilgi').classList.remove('ac')">Kapat</button></div>`;
  bilgi.classList.add('ac');};
// 👕 düğmesi: kendini daha önce seçtiysen doğrudan dolap; seçmediysen adını sor
document.getElementById('giydirBtn').onclick=()=>{
  if(benIdx>=0){ if(benIdx<kapasite) dolapAc(); else {bilgi.innerHTML=`<b>@${BEN}</b> · Sıradasın: yeni tribün açılınca koltuğun gelecek, giydirme o zaman açılır.`; bilgi.classList.add('ac');} return;}
  bilgi.innerHTML=`<b>👕 Taraftarını giydir</b><br>Önce kendini bul: yorum yaptığın Instagram kullanıcı adını yaz.
    <div class="ara" style="display:flex;gap:6px;margin-top:8px"><input id="benAd" placeholder="@kullanıcı adın" autocapitalize="off" spellcheck="false" style="flex:1;min-width:0;font:600 16px system-ui;padding:9px 10px;border-radius:9px;border:0;background:var(--krem);color:var(--ink)"><button id="benTamam" style="font:800 14px system-ui;padding:9px 12px;border-radius:9px;border:0;background:var(--tur);color:var(--ink)">Tamam</button></div>
    <div style="font-size:12px;opacity:.75;margin-top:6px">Deneme için örnek: upown41</div>`;
  bilgi.classList.add('ac');
  const tamam=()=>{const q=document.getElementById('benAd').value.trim().replace(/^@/,'').toLowerCase(); const i=TARAFTAR.findIndex(u=>u.toLowerCase()===q);
    if(i<0){bilgi.querySelector('div:last-child').textContent=`@${q} listede yok. @besincitribun'u takip et, koltuğun gelsin.`; return;}
    BEN=TARAFTAR[i]; depo.koy('bt_ben',BEN); benIdxBul(); kur(); document.getElementById('benAd').blur();
    if(i<kapasite) dolapAc(); else {bilgi.innerHTML=`<b>@${BEN}</b> · Stat dolu, sıradasın: yeni tribün açılınca koltuğun ve giydirme açılır.`;}};
  document.getElementById('benTamam').onclick=tamam; document.getElementById('benAd').addEventListener('keydown',e=>{if(e.key==='Enter')tamam();});
};

/* ================== İSİM ETİKETLERİ (yakınlaşınca) ================== */
const ISIM_N=14, isimEl=[]; const isimKap=document.getElementById('isimler');
for(let j=0;j<ISIM_N;j++){const d=document.createElement('div'); d.className='isim'; isimKap.appendChild(d); isimEl.push(d);}
let isimListe=[], isimZaman=0; const _p=new THREE.Vector3();
function isimleriSec(){
  isimListe=[];
  const dolu=Math.min(kapasite,TARAFTAR.length), cp=cam.position;
  if(cp.distanceTo(ctl.target)>75 || document.getElementById('dolap').classList.contains('ac')) return;
  const aday=[];
  for(let i=0;i<dolu;i++){const p=koltuklar[sira[i]].p; const dd=(p.x-cp.x)**2+(p.y-cp.y)**2+(p.z-cp.z)**2; if(dd<32*32) aday.push([dd,i]);}
  aday.sort((a,b)=>a[0]-b[0]);
  const tut=[];
  for(const [dd,i] of aday){ if(isimListe.length>=ISIM_N) break;
    _p.copy(koltuklar[sira[i]].p); _p.y+=1.3; _p.project(cam); if(_p.z>1||Math.abs(_p.x)>1||Math.abs(_p.y)>1) continue;
    const sx=(_p.x+1)/2*innerWidth, sy=(1-_p.y)/2*innerHeight;
    if(sy<230||sy>innerHeight-110) continue;
    if(tut.some(([x,y])=>Math.abs(x-sx)<95&&Math.abs(y-sy)<22)) continue;
    tut.push([sx,sy]); isimListe.push(i);}
}
function isimleriCiz(){
  for(let j=0;j<ISIM_N;j++){const d=isimEl[j], i=isimListe[j];
    if(i===undefined){d.style.display='none'; continue;}
    _p.copy(koltuklar[sira[i]].p); _p.y+=(i===benIdx?3.2:1.3); _p.project(cam);
    if(_p.z>1){d.style.display='none'; continue;}
    d.style.display='block'; d.style.left=((_p.x+1)/2*innerWidth)+'px'; d.style.top=((1-_p.y)/2*innerHeight)+'px';
    const ad='@'+TARAFTAR[i]+(i===benIdx?' · SEN':''); if(d.textContent!==ad){d.textContent=ad; d.classList.toggle('ben',i===benIdx);}}
}

 document.getElementById('son').textContent=son.length?'SON GELENLER ▸ '+son.join('  ▸  '):'İLK TARAFTAR SEN OL ▸ @besincitribun\'u takip et, koltuğuna otur';}

/* ================== DÖNGÜ ================== */
function boyut(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false); if(composer){composer.setPixelRatio(PR); composer.setSize(w,h);}cam.aspect=w/h;cam.updateProjectionMatrix();
  cam.fov=w<h?55:40; cam.updateProjectionMatrix();}
addEventListener('resize',boyut); boyut();
const v=new THREE.Vector3();
composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,cam));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth/2,innerHeight/2),0.85,0.45,0.78); composer.addPass(bloom);
composer.addPass(new OutputPass()); boyut();
let BLOOM=url.get('bloom')!=='0';
let fpsN=0,fpsT=0,dusuk=0; const fpsEl=document.getElementById('fps');
function adim(t){
  if(ucusVeri){const k=Math.min(1,(t-ucusVeri.t0)/ucusVeri.dur), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    ctl.target.lerpVectors(ucusVeri.ft,ucusVeri.tt,e); cam.position.lerpVectors(ucusVeri.fc,ucusVeri.tc,e); if(k>=1)ucusVeri=null;}
  ctl.update();
  if(secili){ halka.scale.setScalar(1+0.25*Math.sin(t/180)); v.copy(secili.p).project(cam);
    if(v.z<1){et.style.display='block';et.style.left=((v.x+1)/2*innerWidth)+'px';et.style.top=((1-v.y)/2*innerHeight-8)+'px';} else et.style.display='none';}
  if(t-isimZaman>250){isimZaman=t; isimleriSec();} isimleriCiz();
  if(bayrakMesh){const pa=bayrakMesh.geometry.attributes.position; for(let j=0;j<pa.count;j++){const x=pa.getX(j); pa.setZ(j,Math.sin(t/180+x*4)*0.08*(x+0.55));} pa.needsUpdate=true;}
  if(BLOOM) composer.render(); else renderer.render(scene,cam);
  fpsN++; if(t-fpsT>1000){const f=fpsN*1000/(t-fpsT); fpsN=0; fpsT=t; if(fpsEl) fpsEl.textContent=Math.round(f)+' fps'+(BLOOM?'':' · sade');
    if(f<26){ if(++dusuk>=3){ if(BLOOM){BLOOM=false;} else if(PR>1){PR=1; renderer.setPixelRatio(1); boyut();} dusuk=0; } } else dusuk=0;}
}
renderer.setAnimationLoop(adim);

await yukle(1,'Hazır');
document.getElementById('yuk').remove();

window.__hazir=true;
